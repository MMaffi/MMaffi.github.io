<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Página Não Encontrada — MMaffi</title>
    <meta name="description" content="A página que você tentou acessar não existe ou foi movida. Volte ao portfólio oficial de Mateus Maffi.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#07080d">

    <link rel="icon" href="./images/MM_logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/404.css">

    <script>
        (function () {
            try {
                if (localStorage.getItem('theme') === 'light-mode') {
                    document.documentElement.classList.add('light-mode');
                }
            } catch (_) {}
        })();
    </script>
</head>

<body>
    <div class="site-ambient" aria-hidden="true"></div>

    <main class="error-page">
        <div class="error-shell">
            <div class="error-card">
                <span class="section-eyebrow">
                    <i class="fas fa-triangle-exclamation" aria-hidden="true"></i> Erro 404
                </span>
                <h1 class="error-code">404</h1>
                <h2 class="error-title">Página Não Encontrada</h2>
                <p class="error-desc">
                    A rota ou página que você tentou acessar não existe, foi alterada ou removida. Retorne com segurança
                    ao portfólio principal.
                </p>
                <div class="error-actions">
                    <a href="./index.html" class="btn btn-primary">
                        <i class="fas fa-home" aria-hidden="true"></i> Voltar ao Início
                    </a>
                    <button type="button" class="btn btn-secondary" onclick="window.history.back()">
                        <i class="fas fa-arrow-left" aria-hidden="true"></i> Página Anterior
                    </button>
                </div>
            </div>

            <p class="error-footer">© MMaffi — Engenharia Full-Stack</p>
        </div>
    </main>
</body>

</html>
